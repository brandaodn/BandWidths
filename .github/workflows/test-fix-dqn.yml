name: Test fix-dqn

on:
  push:
    branches: [fix-dqn]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy networkx scipy pandas
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Compile changed modules
        run: |
          python -m py_compile \
            article_code/agent.py \
            article_code/enviroment.py \
            article_code/main.py \
            article_code/modules/utils/handle_labels.py
      - name: Run focused unit tests
        working-directory: article_code
        run: python -m unittest discover -s tests -p "test_*.py" -v
