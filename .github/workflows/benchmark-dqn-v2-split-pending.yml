name: DQN v2 - split pending benchmark

on:
  workflow_dispatch:
  push:
    branches: [dqn-v2]
    paths:
      - .github/workflows/benchmark-dqn-v2-split-pending.yml
      - article_code/benchmark_dqn_v2_confirm.py

jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        instance:
          - bcsstk06.mtx
          - lshp1009.mtx
          - lshp1270.mtx
          - lshp1561.mtx
          - lshp1882.mtx
          - lshp2233.mtx
          - bp_400.mtx
          - bp_600.mtx
          - bp_800.mtx
          - bp_1000.mtx
          - bp_1200.mtx
          - bp_1400.mtx
          - bp_1600.mtx
        seed_start: [1, 6, 11, 16, 21, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          pip install numpy networkx scipy pandas
          pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run 5-seed chunk
        working-directory: article_code
        run: |
          python benchmark_dqn_v2_confirm.py \
            --data-dir data/artigo_datas \
            --instance ${{ matrix.instance }} \
            --seeds 5 \
            --seed-start ${{ matrix.seed_start }} \
            --train-steps 300 \
            --eval-steps 60 \
            --output /tmp/result.csv
      - uses: actions/upload-artifact@v4
        with:
          name: split-${{ matrix.instance }}-${{ matrix.seed_start }}
          path: /tmp/result.csv

  aggregate:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "split-*"
          path: artifacts
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy scipy statsmodels
      - name: Aggregate all chunks
        run: |
          python - <<'PY'
          import glob
          import pandas as pd, numpy as np
          from scipy.stats import wilcoxon
          from statsmodels.stats.multitest import multipletests

          files=glob.glob("artifacts/**/result.csv",recursive=True)
          df=pd.concat([pd.read_csv(f) for f in files],ignore_index=True)
          counts=df.groupby("instance")["seed"].nunique()
          print("SEED COUNTS")
          print(counts.to_string())
          if not (counts==30).all():
              raise SystemExit("Not every instance has 30 unique seeds")

          method_cols={
              "DQN":"dqn_total_best",
              "Random":"random_total_best",
              "Eigenvector":"eigen_total_best",
              "Katz":"katz_total_best",
          }
          summary=[]; tests=[]
          for inst,g in df.groupby("instance"):
              for method,col in method_cols.items():
                  x=g[col].to_numpy()
                  summary.append({
                      "instance":inst,"method":method,
                      "mean_bw":x.mean(),"std_bw":x.std(ddof=1),
                      "median_bw":np.median(x),"best_bw":x.min(),
                      "original_bw":g["original_bw"].iloc[0],
                      "rcm_bw":g["rcm_bw"].iloc[0],
                  })
              dqn=g["dqn_total_best"].to_numpy()
              comps=[]; ps=[]
              for method,col in [("Random","random_total_best"),
                                 ("Eigenvector","eigen_total_best"),
                                 ("Katz","katz_total_best")]:
                  other=g[col].to_numpy()
                  if np.all(dqn==other):
                      stat,p=0.0,1.0
                  else:
                      try:
                          stat,p=wilcoxon(dqn,other,zero_method="wilcox",alternative="less")
                      except ValueError:
                          stat,p=np.nan,1.0
                  comps.append({
                      "instance":inst,"comparison":f"DQN<{method}",
                      "dqn_wins":int((dqn<other).sum()),
                      "ties":int((dqn==other).sum()),
                      "other_wins":int((dqn>other).sum()),
                      "wilcoxon_stat":float(stat),"p_raw":float(p),
                  })
                  ps.append(float(p))
              _,padj,_,_=multipletests(ps,alpha=0.05,method="holm")
              for row,p in zip(comps,padj):
                  row["p_holm"]=float(p)
                  row["significant_005"]=bool(p<0.05)
                  tests.append(row)

          pd.DataFrame(summary).to_csv("split_pending_summary.csv",index=False)
          pd.DataFrame(tests).to_csv("split_pending_tests.csv",index=False)
          df.to_csv("split_pending_raw.csv",index=False)
          print(pd.DataFrame(summary).to_string(index=False))
          print(pd.DataFrame(tests).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: split-pending-results
          path: |
            split_pending_summary.csv
            split_pending_tests.csv
            split_pending_raw.csv
